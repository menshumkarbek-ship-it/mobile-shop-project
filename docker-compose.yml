version: '3.8'

services:
  # 💾 Database Service Layer Container
  db:
    image: postgres:15-alpine
    container_name: techvault_postgres_container
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=mobile_shop_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  # ⚡ Redis In-Memory Performance Caching Backend
  redis:
    image: redis:7-alpine
    container_name: techvault_redis_container
    ports:
      - "6379:6379"

  # 🐍 Django Primary Backend API Gateway Monolith
  web:
    build: .
    container_name: techvault_django_monolith
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

volumes:
  postgres_data: