{% extends "shop/base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white border border-gray-200 rounded-2xl p-8 shadow-sm my-8">
    <h2 class="text-2xl font-extrabold text-gray-900 text-center mb-2">Create Secure Account</h2>
    <p class="text-xs text-gray-400 text-center mb-6">Identity verification is required for high-value mobile and laptop transactions.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="bg-red-50 text-red-700 text-sm p-3 rounded-lg mb-4 font-medium">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">First Name</label>
                <input type="text" name="first_name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Last Name</label>
                <input type="text" name="last_name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Username</label>
            <input type="text" name="username" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Email Address</label>
            <input type="email" name="email" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Phone Number</label>
            <input type="text" name="phone_number" placeholder="+123456789" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="p-4 bg-indigo-50/50 rounded-xl border border-indigo-100">
            <label class="block text-xs font-bold uppercase text-indigo-700 mb-1">Passport / National ID ID</label>
            <input type="text" name="passport_number" placeholder="AB123456" required class="w-full border border-indigo-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
        </div>

        <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Password</label>
            <input type="password" name="password" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <button type="submit" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-bold py-2.5 rounded-lg text-sm mt-4 transition-colors">
            Register Verified Profile
        </button>
    </form>
</div>
{% endblock %}
